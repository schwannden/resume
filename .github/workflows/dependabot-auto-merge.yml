name: Dependabot auto-merge

# pull_request_target is required because a workflow triggered by a Dependabot PR
# gets a read-only GITHUB_TOKEN, and enabling auto-merge needs write. No step here
# checks out or executes PR code, and every job is gated on the Dependabot actor.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
